[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-boundary"
version = "0.1.0"
description = "Bounded JSON Schema compatibility witnesses with independent validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "gedouluhui"}]
dependencies = ["z3-solver>=4.13,<5", "jsonschema>=4.23,<5"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.scripts]
schema-boundary = "schema_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
